<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zephyros Developer Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .terminal-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1a3a1a, #0e2b0e);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .badge::before {
      content: "🔒";
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e1e1e;
      color: #b0b0b0;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .social-link:hover {
      background: #2a2a2a;
      color: #ffffff;
    }

    .footer {
      font-size: 0.8rem;
      color: #606060;
    }

    .footer span {
      color: #8a8a8a;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="terminal-icon">🖥️</div>
    <h1>Zephyros Developer Verification</h1>
    <p class="subtitle">
      This domain is used exclusively for verifying the developer of the <strong>Zephyros</strong> Discord bot.<br>
      If you’re seeing this, you’re not accessing the verification endpoint — and that’s totally fine.
    </p>
    <div class="badge">Verified Developer</div>
    <div class="socials">
      <a href="https://youtube.com/@RaxxleForReal" class="social-link" target="_blank">▶️ YouTube</a>
      <a href="https://github.com/Raxxle" class="social-link" target="_blank">📦 GitHub</a>
    </div>
    <p class="footer">
      Developed &amp; Owned by <span>@RaxxleForReal</span>
    </p>
  </div>
</body>
</html>
